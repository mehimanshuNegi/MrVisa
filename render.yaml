services:
  - type: web
    name: mrvisa
    env: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: https://mr-visa.vercel.app,https://nimufly.com,https://www.nimufly.com
